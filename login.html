<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PawRescue – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #1f2937;
      color: #f3f4f6;
    }

    .login-card {
      background-color: #111827;
      box-shadow: 0 1px 3px rgba(255, 255, 255, 0.1);
    }

    input {
      background-color: #374151;
      border: 1px solid #4b5563;
      color: #f3f4f6;
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
    }

    input:focus {
      outline: none;
      border-color: #6366f1;
    }

    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background-color: #4F46E5;
      color: white;
    }

    .btn-primary:hover {
      background-color: rgba(79, 70, 229, 0.8);
    }

    .btn-secondary {
      background-color: #2563EB;
      color: white;
    }

    .btn-secondary:hover {
      background-color: rgba(37, 99, 235, 0.8);
    }

    .btn-alt {
      background-color: #10B981;
      color: white;
    }

    .btn-alt:hover {
      background-color: rgba(16, 185, 129, 0.8);
    }

    .btn-animate {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-animate:hover {
      transform: scale(1.05) translateY(-2px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    a {
      color: #6366f1;
    }

    a:hover {
      text-decoration: underline;
    }

    ::placeholder {
      color: #9ca3af;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4">
  <div class="login-card p-8 rounded-2xl w-full max-w-md">
    <h2 class="text-3xl font-bold mb-1">Welcome</h2>

    <form id="loginForm" class="space-y-5">
      <div><input type="email" id="email" required placeholder="Email"></div>
      <div><input type="password" id="password" required placeholder="Password"></div>
      <button type="submit" class="btn btn-primary btn-animate">Login</button>
    </form>

    <p class="text-center text-sm mt-6 text-gray-400">
      Don’t have an account? <a href="register.html">Register here</a>
    </p>
  </div>

  <!-- Firebase SDK + Auth Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC8NU78nXczDb7xbmVXitm2vTvknjG_zkM",
      authDomain: "smart-public-safety.firebaseapp.com",
      projectId: "smart-public-safety",
      storageBucket: "smart-public-safety.firebasestorage.app",
      messagingSenderId: "85104660303",
      appId: "1:85104660303:web:42ef45a8e766aa259b7f3a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        alert("Login successful!");
        window.location.href = "dashboard.html"; // Change to your home page
      } catch (error) {
        alert(error.message);
      }
    });
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Route Finder with Danger Zones</title>

  <!-- Leaflet + Routing -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      
    }

    #clock {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 8px 12px;
      background: white;
      border-radius: 8px;
      font-weight: bold;
      font-family: monospace;
      z-index: 1000;
    }

    .glass-card {
        background-color:  0 4px 12px rgba;
          
      backdrop-filter: blur(10px);
      max-width: 600px;
      margin: 80px auto 20px;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
      position: relative;
      z-index: 1000;
    }

    .glass-card input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .glass-card button.route-btn {
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      background: linear-gradient(to right, #007bff, #0056b3);
      color: white;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
    }

    #map {
      height: 500px;
      width: 90%;
      max-width: 1000px;
      margin: 20px auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #004aad;
      position: relative;
      z-index: 1;
    }

    #map-description {
      text-align: center;
      color: #333;
      margin-top: 8px;
    }

    .legend {
      padding: 10px;
      background: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      line-height: 1.5;
    }
    .legend i {
      width: 20px;
      height: 20px;
      display: inline-block;
      margin-right: 5px;
    }
    
    /* Danger alert styling */
    .danger-alert {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 0, 0, 0.9);
      color: white;
      padding: 20px 30px;
      border-radius: 10px;
      z-index: 2000;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      max-width: 80%;
      animation: pulse 2s infinite;
    }
    
    .danger-alert h3 {
      margin-top: 0;
      font-size: 24px;
    }
    
    .danger-alert button {
      background: white;
      color: #d00;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    
    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.05); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div id="clock">00:00:00</div>

  <div class="glass-card">
    <input type="text" id="start" placeholder="Enter Current location (e.g., Jaipur)">
    <input type="text" id="end" placeholder="Enter Destination (e.g., Hawa Mahal)">
    <button class="route-btn" onclick="getRoute()">Find route</button>
  </div>

  <div id="map"></div>
  <p id="map-description">Enter start and destination to see route.</p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

  <script>
    // Clock functionality
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString();
      document.getElementById('clock').textContent = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initialize map
    const map = L.map('map').setView([29.1535, 77.0150], 13);
    const key = 'svOwDoN0WCgJ29FRHslD';
    
    // Base map layer
    L.tileLayer(`https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${key}`, {
      tileSize: 512,
      zoomOffset: -1,
      attribution: '&copy; <a href="https://www.maptiler.com/">MapTiler</a> &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>',
      crossOrigin: true
    }).addTo(map);

    // ========== DANGER ZONES ==========
    const dangerStyle = {
      color: '#ff0000',
      fillColor: '#f03',
      fillOpacity: 0.3,
      weight: 2
    };

    // Define danger zones (polygon coordinates)
    const dangerZones = [
  {
    name: "Atlas Cycle Industrial Area (Theft Hotspot)",
    coords: [
      [29.1660, 77.0025],
      [29.1680, 77.0050],
      [29.1650, 77.0070],
      [29.1630, 77.0040],
      [29.1660, 77.0025]
    ]
  },
  {
    name: "Murdana Village (Dispute Zone)",
    coords: [
      [29.1800, 76.9800],
      [29.1820, 76.9830],
      [29.1780, 76.9850],
      [29.1760, 76.9820],
      [29.1800, 76.9800]
    ]
  },
  {
    name: "Sonipat Bus Stand (Pickpocketing Area)",
    coords: [
      [29.1535, 77.0150],
      [29.1545, 77.0175],
      [29.1520, 77.0185],
      [29.1510, 77.0160],
      [29.1535, 77.0150]
    ]
  },
  {
    name: "Sector 15 (Burglary Prone)",
    coords: [
      [29.1580, 77.0220],
      [29.1590, 77.0240],
      [29.1570, 77.0250],
      [29.1560, 77.0230],
      [29.1580, 77.0220]
    ]
  },
  {
    name: "Ganaur Road NH-44 (Highway Robberies)",
    coords: [
      [29.1700, 77.0300],
      [29.1720, 77.0330],
      [29.1680, 77.0350],
      [29.1660, 77.0320],
      [29.1700, 77.0300]
    ]
  },
  {
    name: "Rai Market Area (Eve-teasing Zone)",
    coords: [
      [29.1750, 77.0100],
      [29.1770, 77.0120],
      [29.1740, 77.0140],
      [29.1720, 77.0120],
      [29.1750, 77.0100]
    ]
  },
  {
    name: "Kharkhoda Road (Liquor-Related Crimes)",
    coords: [
      [29.1850, 76.9900],
      [29.1870, 76.9930],
      [29.1830, 76.9950],
      [29.1810, 76.9920],
      [29.1850, 76.9900]
    ]
  }
];

    // Add danger zones to map
    dangerZones.forEach(zone => {
      L.polygon(zone.coords, dangerStyle)
        .addTo(map)
        .bindPopup(`<b>${zone.name}</b><br>Danger Zone - Proceed with caution`);
    });

    // Add legend
    const legend = L.control({position: 'bottomright'});
    legend.onAdd = function() {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <h4>Map Legend</h4>
        <div><i style="background:rgba(255,0,0,0.3)"></i> Danger Zone</div>
        <div><img src="https://cdn-icons-png.flaticon.com/512/684/684908.png" width="20"> Railway Crossing</div>
      `;
      return div;
    };
    legend.addTo(map);

    // ========== RAILWAY CROSSINGS ==========
    const customIcon = L.icon({
      iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
      iconSize: [30, 30],
      iconAnchor: [15, 30],
      popupAnchor: [0, -30]
    });

    // Add railway crossing markers
    const crossings = [
      [26.835056, 75.850698],
      [26.834595, 75.834776],
      [26.835404, 75.878745],
      [26.783978, 75.815954]
    ];

    crossings.forEach(crossing => {
      L.marker(crossing, { icon: customIcon })
        .addTo(map)
        .bindPopup("Railway Crossing (Fatak)");
    });

    // ========== ROUTING ==========
    let routingControl;

    async function geocodePlace(place) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.length > 0) {
        return L.latLng(data[0].lat, data[0].lon);
      } else {
        alert("Location not found: " + place);
        throw new Error("Location not found");
      }
    }

    // Function to check if route intersects with danger zones using Turf.js
    function checkRouteForDangers(routeCoords) {
      const routeLine = turf.lineString(routeCoords.map(coord => [coord.lng, coord.lat]));
      const intersectingZones = [];
      
      dangerZones.forEach(zone => {
        const zonePolygon = turf.polygon([zone.coords.map(coord => [coord[1], coord[0]])]);
        
        if (turf.booleanIntersects(routeLine, zonePolygon)) {
          intersectingZones.push(zone.name);
        }
      });
      
      return intersectingZones;
    }

    // Function to show danger alert
    function showDangerAlert(zones) {
      const alertDiv = document.createElement('div');
      alertDiv.className = 'danger-alert';
      alertDiv.innerHTML = `
        <h3>⚠️ DANGER WARNING ⚠️</h3>
        <p>Your route passes through these danger zones:</p>
        <ul style="text-align: left; margin-left: 20px;">
          ${zones.map(zone => `<li>${zone}</li>`).join('')}
        </ul>
        <p>Proceed with extreme caution!</p>
        <button onclick="this.parentNode.remove()">I Understand</button>
      `;
      
      document.body.appendChild(alertDiv);
      
      // Auto-remove after 15 seconds
      setTimeout(() => {
        if (document.body.contains(alertDiv)) {
          document.body.removeChild(alertDiv);
        }
      }, 15000);
    }

    async function getRoute() {
      const start = document.getElementById("start").value;
      const end = document.getElementById("end").value;

      if (!start || !end) {
        alert("Please enter both start and destination locations");
        return;
      }

      try {
        const startCoords = await geocodePlace(start);
        const endCoords = await geocodePlace(end);

        if (routingControl) {
          map.removeControl(routingControl);
        }

        routingControl = L.Routing.control({
          waypoints: [startCoords, endCoords],
          routeWhileDragging: false,
          showAlternatives: false,
          lineOptions: {
            styles: [{color: '#004aad', opacity: 0.7, weight: 5}]
          },
          createMarker: function(i, wp) {
            return L.marker(wp.latLng, {
              draggable: false,
              icon: L.icon({
                iconUrl: i === 0 ? 
                  'https://cdn-icons-png.flaticon.com/512/535/535137.png' : // Start icon
                  'https://cdn-icons-png.flaticon.com/512/2776/2776067.png', // End icon
                iconSize: [32, 32]
              })
            });
          }
        }).addTo(map);

        // When route is found
        routingControl.on('routesfound', function(e) {
          const routes = e.routes;
          const route = routes[0];
          const routeCoords = route.coordinates;
          
          // Check for danger zone intersections
          const dangerousZones = checkRouteForDangers(routeCoords);
          
          if (dangerousZones.length > 0) {
            showDangerAlert(dangerousZones);
          }
          
          // Fit bounds with some padding
          map.fitBounds(route.bounds, {
            padding: [50, 50]
          });
          
          document.getElementById("map-description").textContent = "Route displayed on the map";
        });

        document.getElementById("map-description").textContent = "Calculating route...";

      } catch (err) {
        console.error(err);
        document.getElementById("map-description").textContent = "Error finding route";
      }
    }
  </script>
</body>
</html>
